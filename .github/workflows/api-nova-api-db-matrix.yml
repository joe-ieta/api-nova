name: api-nova-api db matrix

on:
  push:
    paths:
      - '.github/workflows/api-nova-api-db-matrix.yml'
      - 'packages/api-nova-api/**'
      - 'packages/api-nova-ui/**'
      - 'packages/api-nova-parser/**'
      - 'packages/api-nova-server/**'
  pull_request:
    paths:
      - '.github/workflows/api-nova-api-db-matrix.yml'
      - 'packages/api-nova-api/**'
      - 'packages/api-nova-ui/**'
      - 'packages/api-nova-parser/**'
      - 'packages/api-nova-server/**'

jobs:
  api-db-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db_type: [sqlite, postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Setup exact npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Build shared runtime dependencies
        run: |
          npm run build --workspace api-nova-parser
          npm run build --workspace api-nova-server

      - name: Run API unit tests with their isolated SQL.js fixtures
        env:
          # Entity decorators must match the SQL.js DataSources constructed by
          # these tests. The matrix database is exercised by db:smoke below.
          DB_TYPE: sqlite
        run: npm run test --workspace api-nova-api -- --runInBand

      - name: Run UI regressions
        run: node --test packages/api-nova-ui/scripts/test-*.cjs

      - name: Build API package
        run: npm run build --workspace api-nova-api

      - name: Build UI package
        run: npm run build --workspace api-nova-ui

      # Runtime database and credentials must not override unit-test fixtures.
      - name: Set database environment
        shell: bash
        run: |
          echo "NODE_ENV=test" >> "$GITHUB_ENV"
          echo "PORT=3101" >> "$GITHUB_ENV"
          echo "MCP_PORT=3422" >> "$GITHUB_ENV"
          echo "MCP_SERVER_PORT=3422" >> "$GITHUB_ENV"
          echo "DB_SYNCHRONIZE=false" >> "$GITHUB_ENV"
          jwt_secret=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          admin_password=$(node -e "process.stdout.write('Ci!' + require('crypto').randomBytes(24).toString('hex'))")
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "SUPER_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

          if [ "${{ matrix.db_type }}" = "sqlite" ]; then
            echo "DB_TYPE=sqlite" >> "$GITHUB_ENV"
            echo "DB_SQLITE_PATH=$GITHUB_WORKSPACE/tmp/ci/sqlite/api-nova.db" >> "$GITHUB_ENV"
          else
            echo "DB_TYPE=postgres" >> "$GITHUB_ENV"
            echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
            echo "DB_PORT=5432" >> "$GITHUB_ENV"
            echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
            echo "DB_PASSWORD=pg" >> "$GITHUB_ENV"
            echo "DB_DATABASE=api_nova_api" >> "$GITHUB_ENV"
          fi

      - name: Prepare PostgreSQL database
        if: matrix.db_type == 'postgres'
        shell: bash
        env:
          PGPASSWORD: pg
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -c "DROP DATABASE IF EXISTS api_nova_api;"
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE api_nova_api;"

      - name: Verify matrix database schema and persistence
        run: npm run db:smoke --workspace api-nova-api -- ${{ matrix.db_type }}

      - name: Initialize isolated database
        run: npm run migration:run --workspace api-nova-api

      - name: Startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/ci/logs
          node packages/api-nova-api/dist/src/main.js > tmp/ci/logs/api-${{ matrix.db_type }}.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/api/health/live > tmp/ci/logs/health-${{ matrix.db_type }}.json; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:3101/api/health/live
          curl -fsS http://127.0.0.1:3101/api/system/initialization

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-db-matrix-${{ matrix.db_type }}-logs
          path: tmp/ci/logs
